[project]
name = "translation-asr-service"
version = "0.1.0"
description = "HTTP ASR service for the translation app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
sensevoice = [
  "funasr>=1.2,<2",
  "modelscope>=1.20,<2",
]
firered = [
  "fireredasr>=0.1",
  "torch>=2.3",
]
qwen = [
  "qwen-asr>=0.1",
  "scipy>=1.11,<2",
  "torch>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
