[project]
name = "ai-phone-speaker-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "pytest>=8,<9",
  "soxr>=0.5",
]
sortformer = ["numpy>=1.26", "soxr>=0.5", "torch>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
