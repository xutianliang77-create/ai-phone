[project]
name = "translation-model-service"
version = "0.1.0"
description = "OpenAI-compatible translation service for the translation app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
hymt2 = [
  "torch>=2.3",
  "transformers>=4.56.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
