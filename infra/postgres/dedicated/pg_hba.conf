# Local administration still requires SCRAM credentials.
local   all                 all                                             scram-sha-256

# Docker bridge clients must use TLS and are scoped by database and role.
hostssl ai_phone_staging    ai_phone_stage_runtime      127.0.0.1/32        scram-sha-256
hostssl ai_phone_staging    ai_phone_stage_migrator     127.0.0.1/32        scram-sha-256
hostssl all                 ai_phone_stage_admin        127.0.0.1/32        scram-sha-256
hostssl replication         ai_phone_stage_replica      127.0.0.1/32        scram-sha-256
hostssl ai_phone_staging    ai_phone_stage_runtime      172.16.0.0/12       scram-sha-256
hostssl ai_phone_staging    ai_phone_stage_migrator     172.16.0.0/12       scram-sha-256
hostssl all                 ai_phone_stage_admin        172.16.0.0/12       scram-sha-256
hostssl replication         ai_phone_stage_replica      172.16.0.0/12       scram-sha-256

# The published port is loopback-only, but fail closed for every other path.
hostnossl all               all                         0.0.0.0/0           reject
hostnossl all               all                         ::/0                 reject
hostssl all                 all                         0.0.0.0/0           reject
hostssl all                 all                         ::/0                 reject
