x-runtime: &runtime
  image: ai-phone-server:${AI_PHONE_IMAGE_TAG:-local}
  env_file:
    - ${AI_PHONE_ENV_FILE}
  network_mode: host
  restart: unless-stopped

services:
  api:
    <<: *runtime
    build:
      context: ../..
      dockerfile: infra/ai-phone-server/Dockerfile
    container_name: ai-phone-api
    command: ["node", "services/api-server/dist/main.js"]
    volumes:
      - ${AI_PHONE_DATA_DIR}:/data/ai-phone
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3110/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *runtime
    container_name: ai-phone-gateway
    command: ["node", "services/realtime-gateway/dist/main.js"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3111/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
