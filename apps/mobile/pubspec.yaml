name: translation_mobile
description: Cross-platform mobile app for realtime Chinese-English interpretation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.2.3
  livekit_client: 2.8.1
  flutter_webrtc: 1.4.0
  path_provider: ^2.1.5
  record: ^7.0.0
  share_plus: 12.0.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
