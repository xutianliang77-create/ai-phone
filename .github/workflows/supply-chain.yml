name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/wujie-gitleaks"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/wujie-gitleaks/archive.tar.gz"
          printf '%s  %s\n' '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' \
            "$RUNNER_TEMP/wujie-gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wujie-gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/wujie-gitleaks" gitleaks
          echo "$RUNNER_TEMP/wujie-gitleaks" >> "$GITHUB_PATH"
      - name: Scan complete event commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$HEAD_SHA^{commit}"
          log_range="$HEAD_SHA"
          if [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$BASE_SHA^{commit}"
            log_range="$BASE_SHA..$HEAD_SHA"
          fi
          gitleaks detect --redact --exit-code=2 --log-opts="$log_range" \
            --report-format=sarif --report-path="$RUNNER_TEMP/gitleaks-results.sarif"
      - name: Preserve redacted scan result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: ignore

  source-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: ai-phone-source.spdx.json
          artifact-name: ai-phone-source.spdx.json
          upload-release-assets: false

  image-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: plan
        run: echo "matrix=$(node scripts/list_livekit_sbom_images.mjs --matrix)" >> "$GITHUB_OUTPUT"

  image-sbom:
    needs: image-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          output-file: livekit-${{ matrix.name }}.spdx.json
          artifact-name: livekit-${{ matrix.name }}.spdx.json
          upload-release-assets: false
