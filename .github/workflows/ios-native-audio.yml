name: Wujie iOS native audio regression

on:
  pull_request:
  push:
    branches:
      - develop/wujie-1.1-public

permissions:
  contents: read

concurrency:
  group: ios-native-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-audio:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      WUJIE_CI_DATA_MODE: synthetic_only
      WUJIE_ALLOW_PRODUCTION_SECRETS: "false"
      WUJIE_ALLOW_PRODUCTION_DATA: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run check:ios-native-audio -- --output .cache/ios-native-audio/receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-native-audio-receipt
          path: .cache/ios-native-audio/receipt.json
          if-no-files-found: error
          retention-days: 14
